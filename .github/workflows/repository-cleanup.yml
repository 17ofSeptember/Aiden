name: Repository cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust source
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Fix README firmware paths
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('README.md'); s=p.read_text(encoding='utf-8'); s=s.replace('firmware/arduino-uno.ino','firmware/arduino-uno/arduino-uno.ino'); s=s.replace('│   └── arduino-uno/arduino-uno.ino','│   └── arduino-uno/\\n│       └── arduino-uno.ino'); p.write_text(s, encoding='utf-8')"

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src-tauri
          if git diff --cached --quiet; then
            echo "No cleanup changes needed."
            exit 0
          fi
          git commit -m "Format Rust source and fix README firmware paths"
          git push
